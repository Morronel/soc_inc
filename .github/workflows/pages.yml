name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Collect site files
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest .nojekyll css js assets _site/
      - name: Stamp build for cache busting
        run: |
          BUILD="${GITHUB_SHA::8}"
          sed -i "s/__BUILD__/$BUILD/g" _site/index.html _site/js/config.js
          echo "{\"build\":\"$BUILD\"}" > _site/version.json
          grep -c "$BUILD" _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
